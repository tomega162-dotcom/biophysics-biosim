        .stat-val { font-size: 28px; font-weight: 700; color: #38bdf8; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .btn-push:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .btn-done { background: #059669; color: white; }
        .log { margin-top: 20px; background: #0f172a; border-radius: 8px; padding: 16px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.8; }
        .log-ok { color: #4ade80; }
        .log-err { color: #f87171; }
        .log-info { color: #94a3b8; }
        .progress { background: #334155; border-radius: 6px; height: 8px; margin-top: 16px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #2563eb, #38bdf8); height: 100%; width: 0%; transition: width 0.3s; border-radius: 6px; }
    </style>

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="log-${type}">${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        window.pushAllPins = async function() {
            const btn = document.getElementById('btn-push');
            btn.disabled = true;
            btn.textContent = '⌛ Authenticating...';

            try {
                // Step 1: Anonymous Auth
                log('Authenticating with Firebase...', 'info');
                await signInAnonymously(auth);
                log('✅ Authentication successful', 'ok');

                // Step 2: Push PINs in batch (max 500 per batch, we have 301)
                btn.textContent = '⌛ Pushing 301 PINs...';
                const now = new Date().toISOString();
                const batch = writeBatch(db);
                let count = 0;

                // Admin PIN
                const adminRef = doc(db, "accessPins", ADMIN_PIN);
                batch.set(adminRef, {
                    pinCode: ADMIN_PIN,
                    used: false,
                    assignedTo: null,
                    role: "admin",
                    createdAt: now
                });
                count++;
                log(`[${count}/301] Admin PIN: B#8&zP9!kL2$`, 'ok');

                // Student PINs
                for (const pin of STUDENT_PINS) {
                    const pinRef = doc(db, "accessPins", pin);
                    batch.set(pinRef, {
                        pinCode: pin,
                        used: false,
                        assignedTo: null,
                        role: "student",
                        createdAt: now
                    });
                    count++;
                    if (count % 50 === 0) {
                        log(`[${count}/301] Processing... (${pin})`, 'info');
                        document.getElementById('progress-bar').style.width = `${(count / 301) * 100}%`;
                        document.getElementById('pushed-count').textContent = count;
                    }
                }

                log('Committing batch to Firestore...', 'info');
                await batch.commit();

                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('pushed-count').textContent = '301';
                
                log('', 'ok');
                log('═══════════════════════════════════════', 'ok');

                log('   → Collection: accessPins', 'ok');
                log('═══════════════════════════════════════', 'ok');
                
                btn.textContent = '✅ All 301 PINs Activated!';
                btn.className = 'btn-done';

                log(`❌ ERROR: ${error.message}`, 'err');
                log('Check: 1) Anonymous Auth enabled? 2) Firestore created? 3) Rules set?', 'err');
                btn.disabled = false;
                btn.textContent = '🔄 Retry Push';
            }
        };
